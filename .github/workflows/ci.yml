name: ASCENDRA Automated Quality & CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Secret Scanning & Repository Protection
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Security & Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js for Security Tooling
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Execute Lightweight Secret Scanner
        run: node scripts/check-secrets.js

  # ----------------------------------------------------------------------------
  # Job 2: Node.js Backend Verification Suite
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Test Suite (Node.js 20.x)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Tests (Jest)
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: postgresql://test:test@localhost:5432/ascendra_test
          JWT_SECRET: test_secret_key_for_ascendra_jwt_dev_12345
          JWT_REFRESH_SECRET: test_refresh_secret_key_for_ascendra_jwt_dev_12345
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d
          AI_SERVICE_URL: http://localhost:8000
          AI_TIMEOUT_MS: 3000
        run: npm test -- --detectOpenHandles --forceExit

  # ----------------------------------------------------------------------------
  # Job 3: Python AI Service Verification Suite
  # ----------------------------------------------------------------------------
  ai-service-ci:
    name: AI Service Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Microservice Tests (Pytest)
        env:
          ENVIRONMENT: test
          HOST: 0.0.0.0
          PORT: 8000
        run: pytest -v --tb=short
