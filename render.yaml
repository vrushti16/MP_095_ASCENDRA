# ==============================================================================
# ASCENDRA — Render Infrastructure Blueprint (Zero-Docker Deployment)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI AI Puzzle Microservice (Python 3.11 Runtime)
  # ----------------------------------------------------------------------------
  - type: web
    name: ascendra-ai-service
    runtime: python
    rootDir: ai-service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Node.js Backend & Dual Web Portals (Node.js 22 Runtime)
  # ----------------------------------------------------------------------------
  - type: web
    name: ascendra-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: OTP_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ascendra-ai-service
          property: host
      - key: AI_TIMEOUT_MS
        value: "6000"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_AUTH_USER
        sync: false
